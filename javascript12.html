<!DOCTYPE html>
<html>
<head>
    <title>Student Result Dashboard</title>
</head>
<body>

<script>
    let students = [
        { name: "Rahul", score: 85 },
        { name: "Abhi", score: 92 },
        { name: "Arun", score: 55 },
        { name: "Anu", score: 72 },
        { name: "Vishnu", score: 30 }
    ];

    let names = students.map(student => student.name);
    console.log("All Student Names:", names);

    let above60 = students
        .filter(student => student.score > 60)
        .map(student => student.name);

    console.log("Students scoring above 60:", above60);

    let totalScore = students.reduce((total, student) => {
        return total + student.score;
    }, 0);

    console.log("Total Score:", totalScore);

    let allPassed = students.every(student => student.score > 35);

    console.log("All students passed:", allPassed);

    let above90 = students.some(student => student.score > 90);

    console.log("At least one scored above 90:", above90);

    let sortedStudents = [...students].sort((a, b) => b.score - a.score);

    console.log("Students sorted by score:");

    sortedStudents.forEach(student => {
        console.log(student.name + " - " + student.score);
    });
</script>

</body>
</html>
