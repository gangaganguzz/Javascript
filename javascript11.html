<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
</head>
<body>

<script>

let products = ["Apple", "Grapes", "Mango", "Orange"];
let prices = [50, 30, 60, 40];

let productList = [];

for (let i = 0; i < products.length; i++) {
    productList.push("Product: " + products[i] + " - Price: " + prices[i]);
}
console.log("All Products:");

for (let product of productList) {
    console.log(product);
}
console.log("Products with price greater than 50:");

for (let i = 0; i < products.length; i++) {
    if (prices[i] > 50) {
        console.log("Product: " + products[i] + " - Price: " + prices[i]);
    }
}

products.push("Watermelon");
prices.push(80);
console.log("Updated Product List:");

for (let i = 0; i < products.length; i++) {
    console.log("Product: " + products[i] + " - Price: " + prices[i]);
}

</script>

</body>
</html>
